<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WildDex</title>
  <meta name="description" content="Scan real animals with your camera and collect them in a stamp album.">
  <meta name="theme-color" content="#F3F8F5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <nav class="tabs" aria-label="Sections">
        <button type="button" data-tab="scan" aria-current="page">Scan</button>
        <span aria-hidden="true">|</span>
        <button type="button" data-tab="album">Album</button>
        <span aria-hidden="true">|</span>
        <button type="button" data-tab="passport">Passport</button>
      </nav>
    </header>

    <main>
      <!-- SCAN -->
      <section id="view-scan" class="view" data-view="scan">
        <div class="masthead">
          <div>
            <h1 class="display">WildDex</h1>
            <p class="sci">Fauna collectoria</p>
          </div>
          <p class="big-count" aria-label="Animals registered"><span id="count-num">0</span><small id="count-total">/ 0</small></p>
        </div>

        <div class="viewfinder" id="viewfinder">
          <video id="video" playsinline muted></video>
          <canvas id="freeze" width="448" height="448" aria-hidden="true"></canvas>
          <svg class="rings" viewBox="0 0 100 100" aria-hidden="true">
            <ellipse cx="50" cy="50" rx="44" ry="44" />
            <ellipse cx="50" cy="50" rx="34" ry="34" />
            <ellipse cx="50" cy="50" rx="24" ry="24" class="inner" />
            <circle cx="44" cy="50" r="1.6" class="dot" />
            <circle cx="56" cy="50" r="1.6" class="dot" />
          </svg>
          <div class="sweep" aria-hidden="true"></div>
          <div class="vf-overlay" id="vf-overlay">
            <p class="vf-title">Scanner is resting</p>
            <p class="vf-text" id="vf-text">Turn on the camera, or upload a photo of an animal.</p>
            <button type="button" class="btn primary" id="btn-camera">Turn on camera</button>
          </div>
        </div>

        <p class="status" id="status" role="status" aria-live="polite">Point at an animal and press scan.</p>
        <div class="meter" id="meter" hidden><span id="meter-bar"></span></div>

        <div class="controls">
          <label class="round-btn" title="Scan a photo from your gallery">
            <input type="file" accept="image/*" id="file" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
            <span class="sr">Upload photo</span>
          </label>
          <button type="button" class="scan-btn" id="btn-scan" aria-label="Scan">
            <span class="scan-ring"></span><span class="scan-label">Scan</span>
          </button>
          <button type="button" class="round-btn" id="btn-flip" title="Switch camera">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h11l-3-3M20 16H9l3 3"/></svg>
            <span class="sr">Switch camera</span>
          </button>
        </div>

        <section class="recent" id="recent-wrap" hidden>
          <h2 class="kicker">Recently registered</h2>
          <div class="recent-strip" id="recent"></div>
        </section>
      </section>

      <!-- ALBUM -->
      <section id="view-album" class="view" data-view="album" hidden>
        <div class="masthead">
          <div>
            <h1 class="display">Album</h1>
            <p class="sci">Philatelia naturalis</p>
          </div>
          <p class="big-count"><span id="album-pct">0</span><small>%</small></p>
        </div>
        <div class="progress"><span id="album-bar"></span></div>
        <p class="album-sub" id="album-sub"></p>
        <div class="chips" id="chips" role="tablist" aria-label="Album sheets"></div>
        <div id="sheets"></div>
      </section>

      <!-- PASSPORT -->
      <section id="view-passport" class="view" data-view="passport" hidden>
        <div class="masthead">
          <div>
            <h1 class="display">Passport</h1>
            <p class="sci" id="rank-sci">Collector novus</p>
          </div>
          <p class="big-count"><span id="pts">0</span><small>pts</small></p>
        </div>
        <div id="passport"></div>
      </section>
    </main>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1">
      <button type="button" class="sheet-close" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
