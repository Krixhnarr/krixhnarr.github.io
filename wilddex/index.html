<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WildDex</title>
  <meta name="description" content="Scan real animals and collect them as cards — a field-scanner collectible game.">
  <meta name="theme-color" content="#1F1C27">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preload" href="fonts/russo-one-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-fx" aria-hidden="true"><i></i><i></i><i></i><b></b></div>
  <div class="app">
    <header class="topbar">
      <button type="button" class="op-chip" data-tab="id" aria-label="Operator profile">
        <span class="op-hex"><b id="op-level">1</b></span>
        <span class="op-meta"><b id="op-name">Operator</b><span class="op-xp" aria-hidden="true"><em id="op-xp-bar"></em></span></span>
        <i class="badge" id="id-badge" hidden></i>
      </button>
      <div class="pills">
        <button type="button" class="pill crates" data-tab="id" data-goto="supply" aria-label="Supply crates">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5 12 4l9 4.5v9L12 22l-9-4.5Z"/><path d="M3 8.5 12 13l9-4.5M12 13v9"/></svg><b id="crates">0</b>
        </button>
        <span class="pill credits" id="meters" role="img" aria-label="Credits">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 9l-9 13L3 9Z"/><path d="M3 9h18M9 9l3 13 3-13M8 2.8 9 9l3-7 3 7 1-6.2"/></svg><b id="shards">0</b>
        </span>
      </div>
    </header>

    <main>
      <!-- HOME -->
      <section class="view" data-view="home">
        <div id="home"></div>
      </section>

      <!-- SCAN -->
      <section class="view" data-view="scan" hidden>
        <div class="screen-head">
          <div><h1 class="screen-title">Scan</h1></div>
          <button type="button" class="help-btn" data-help="scan" aria-label="How scanning works">?</button>
        </div>

        <div class="viewfinder" id="viewfinder">
          <video id="video" playsinline muted></video>
          <canvas id="freeze" width="448" height="448" aria-hidden="true"></canvas>
          <div class="vf-dots" aria-hidden="true"></div>
          <svg class="hud" viewBox="0 0 100 100" aria-hidden="true">
            <g class="ticks"><circle cx="50" cy="50" r="46" /></g>
            <g class="rings">
              <circle cx="50" cy="50" r="36" />
              <circle cx="50" cy="50" r="26" />
              <circle cx="50" cy="50" r="16" />
            </g>
            <circle cx="44.5" cy="50" r="1.3" class="dot" />
            <circle cx="55.5" cy="50" r="1.3" class="dot" />
            <path class="cross" d="M50 8v6M50 86v6M8 50h6M86 50h6" />
            <path class="brackets" d="M4 14V4h10M86 4h10v10M96 86v10H86M14 96H4V86" />
          </svg>
          <div class="readout tl"><span id="rec">○ STBY</span></div>
          <div class="readout bl" id="lens">LENS:REAR</div>
          <div class="sweep" aria-hidden="true"></div>
          <div class="lockon" id="lockon" aria-hidden="true">
            <svg viewBox="0 0 100 100">
              <circle class="lk-ticks" cx="50" cy="50" r="36"/>
              <circle class="lk-track" cx="50" cy="50" r="30"/>
              <circle class="lk-arc" id="lock-arc" cx="50" cy="50" r="30" pathLength="100"/>
              <g class="lk-reticle"><circle cx="50" cy="50" r="21"/><path d="M50 16v9M50 75v9M16 50h9M75 50h9"/></g>
            </svg>
            <div class="lk-core"><small>SYNC</small><b id="lock-pct">0%</b></div>
            <p class="lk-stamp">LOCKED</p>
          </div>
          <div class="sweep-guide" aria-live="polite">
            <p><span class="arr l">◀◀◀</span><b id="sweep-text">Slide phone left</b><span class="arr r">▶▶▶</span></p>
            <i class="bar"><span id="sweep-bar"></span></i>
          </div>
          <div class="vf-overlay" id="vf-overlay">
            <p class="vf-title">Camera off</p>
            <p class="vf-text" id="vf-text">Point it at a real, live animal.</p>
            <button type="button" class="btn primary big" id="btn-camera">Turn on camera</button>
          </div>
        </div>

        <div class="term" id="term" role="log" aria-live="polite" aria-label="Scanner log"></div>

        <div class="controls">
          <button type="button" class="side-btn" id="btn-torch" title="Flashlight" aria-pressed="false" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8v4l-2 3v11h-4V10L8 7Z"/><path d="M8 7h8M12 13v2"/></svg>
            <span>Light</span>
          </button>
          <button type="button" class="scan-btn" id="btn-scan" aria-label="Scan">
            <span class="scan-orbit"></span><span class="scan-core"></span><span class="scan-label">SCAN</span>
          </button>
          <button type="button" class="side-btn" id="btn-flip" title="Switch camera">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h11l-3-3M20 16H9l3 3"/></svg>
            <span>Flip</span>
          </button>
        </div>

        <section class="recent" id="recent-wrap" hidden>
          <div class="section-head"><h2>Recent pulls</h2></div>
          <div class="recent-strip" id="recent"></div>
        </section>
      </section>

      <!-- INVENTORY -->
      <section class="view" data-view="binder" hidden>
        <div class="screen-head">
          <div><h1 class="screen-title">Cards</h1><p class="sub" id="binder-sub"></p></div>
        </div>

        <div class="filters">
          <div class="chips" id="set-chips" role="tablist" aria-label="Sectors"></div>
          <div class="type-filter" id="type-chips" aria-label="Filter by affinity"></div>
          <div class="filter-row">
            <label class="select"><span>sort</span>
              <select id="sort">
                <option value="no">number</option>
                <option value="rarity">rarity</option>
                <option value="level">level</option>
                <option value="pwr">power</option>
                <option value="recent">recent</option>
              </select>
            </label>
            <label class="check"><input type="checkbox" id="owned-only"> owned only</label>
          </div>
        </div>

        <section class="inv-detail chamfer" id="inv-detail" aria-live="polite"></section>
        <div class="slot-grid" id="grid"></div>
        <p class="empty" id="grid-empty" hidden>No cards match these filters yet.</p>
      </section>

      <!-- ARENA -->
      <section class="view" data-view="arena" hidden>
        <div class="screen-head">
          <div><h1 class="screen-title">Arena</h1><p class="sub" id="arena-sub"></p></div>
        </div>
        <div id="arena"></div>
      </section>

      <!-- OPS -->
      <section class="view" data-view="ops" hidden>
        <div class="screen-head">
          <div><h1 class="screen-title">Ops</h1></div>
        </div>
        <div id="ops"></div>
      </section>

      <!-- ID -->
      <section class="view" data-view="id" hidden>
        <div class="screen-head">
          <div><h1 class="screen-title">Operator</h1><p class="sub" id="rank-sub"></p></div>
        </div>
        <div id="profile"></div>
      </section>
    </main>
  </div>

  <nav class="tabbar" aria-label="Sections">
    <button type="button" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg><span>Home</span></button>
    <button type="button" data-tab="binder"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="13" height="17" rx="2"/><path d="M4 7v12a2 2 0 0 0 2 2h10"/><path d="m13.5 8.5 1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4Z"/></svg><span>Cards</span></button>
    <button type="button" class="tab-scan" data-tab="scan"><span class="tab-scan-core"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><circle cx="12" cy="12" r="3.5"/></svg></span><span>Scan</span></button>
    <button type="button" data-tab="arena"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/><path d="M9.5 17.5 21 6V3h-3L6.5 14.5M11 19l-6-6M8 16l-4 4M5 21l-2-2"/></svg><span>Arena</span><i class="badge" id="arena-badge" hidden></i></button>
    <button type="button" data-tab="ops"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10l1.5 1.5L13 9M9 16h6"/></svg><span>Ops</span><i class="badge" id="ops-badge" hidden></i></button>
  </nav>
  <div class="pip-toast" id="pip-toast" hidden></div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1">
      <button type="button" class="sheet-close" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>
  <div class="levelup" id="levelup" hidden role="dialog" aria-modal="true" aria-label="Level up"></div>
  <div class="boot" id="boot" hidden aria-hidden="true"><pre id="boot-log"></pre></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
